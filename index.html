<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whizz EV - Master ERP Portal</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --tab:#00c2ff; --tab-rgb:0,194,255; --bg-primary: #080c14; --bg-surface: #0e1726; --bg-sidebar: #060a12; --border-color: rgba(0, 194, 255, 0.2); --primary-color: #00c2ff; }
    body { background-color: var(--bg-primary); color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid #1e293b; }
    .nav-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: none; background: transparent; color: #94a3b8; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .nav-btn { border: 1px solid transparent; }
    .nav-btn.t-allotment  { --c:#00c2ff; --c-rgb:0,194,255; }
    .nav-btn.t-submission { --c:#fb7185; --c-rgb:251,113,133; }
    .nav-btn.t-net-count  { --c:#34d399; --c-rgb:52,211,153; }
    .nav-btn:hover, .nav-btn.active { background: rgba(var(--c-rgb), 0.12); color: var(--c); border: 1px solid rgba(var(--c-rgb), 0.45); }
    body[data-tab="allotment"]  { --tab:#00c2ff; --tab-rgb:0,194,255; }
    body[data-tab="submission"] { --tab:#fb7185; --tab-rgb:251,113,133; }
    body[data-tab="net-count"]  { --tab:#34d399; --tab-rgb:52,211,153; }
    .whizz-card { border-color: rgba(var(--tab-rgb), 0.35) !important; }
    #main-title { color: var(--tab); }
    .whizz-card { background: linear-gradient(145deg, #0e1726 0%, #090e17 100%); border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 14px; padding: 24px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 1024px) { .form-grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .form-grid-3 { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select { padding: 10px 14px; border-radius: 8px; border: 1px solid #1e293b; background-color: #060a12; color: #f8fafc; font-size: 0.85rem; outline: none; transition: all 0.3s ease; }
    .form-group input:focus, .form-group select:focus { border-color: var(--tab); box-shadow: 0 0 10px rgba(var(--tab-rgb), 0.3); }
    .submit-btn { background: linear-gradient(90deg, #0052ff 0%, #00c2ff 100%); color: #fff; font-weight: 700; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.95rem; transition: 0.3s; }
    .submit-btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(0, 194, 255, 0.4); }
    .adm-table-wrap { overflow-x: auto; border: 1px solid #1e293b; border-radius: 8px; }
    .adm-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
    .adm-table th { background: #060a12; color: #94a3b8; padding: 12px; font-weight: 700; border-bottom: 1px solid #1e293b; white-space: nowrap; }
    .adm-table td { padding: 12px; border-top: 1px solid #1e293b; white-space: nowrap; }
    /* Net Count filters */
    .flt-bar { display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px; }
    .flt-bar .form-group { min-width:160px; }
    .flt-bar input[type=date] { color-scheme: dark; }
    .form-group input[type=date] { color-scheme: dark; cursor: pointer; }
    .form-group input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 1; }
    .ms-wrap { position:relative; min-width:200px; }
    .ms-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; border-radius:8px; border:1px solid #1e293b; background:#060a12; color:#f8fafc; font-size:0.85rem; cursor:pointer; text-align:left; transition:all .2s; }
    .ms-btn:hover, .ms-wrap.open .ms-btn { border-color:#00c2ff; box-shadow:0 0 10px rgba(0,194,255,.25); }
    .ms-menu { display:none; position:absolute; top:calc(100% + 6px); left:0; min-width:100%; width:max-content; max-width:300px; max-height:280px; overflow-y:auto; background:#0b1322; border:1px solid rgba(0,194,255,.35); border-radius:10px; box-shadow:0 14px 34px rgba(0,0,0,.65); z-index:70; padding:6px; }
    .ms-wrap.open .ms-menu { display:block; }
    .ms-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; font-size:0.82rem; color:#cbd5e1; cursor:pointer; user-select:none; }
    .ms-item:hover { background:rgba(0,194,255,.1); }
    .ms-item.selected { color:#fff; font-weight:600; }
    .ms-check { width:18px; height:18px; flex:none; border:1px solid #334155; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-size:0.8rem; color:transparent; font-weight:800; }
    .ms-item.selected .ms-check { border-color:#10b981; background:rgba(16,185,129,.15); color:#34d399; }
    .ms-empty { padding:10px; font-size:0.78rem; color:#64748b; }
    .flt-clear { padding:10px 16px; border-radius:8px; border:1px solid #334155; background:transparent; color:#94a3b8; font-size:0.8rem; font-weight:700; cursor:pointer; transition:.2s; }
    .flt-clear:hover { border-color:#f43f5e; color:#fb7185; }
    .type-btn { flex:1; padding:12px; border-radius:10px; border:1px solid #1e293b; background:#060a12; color:#94a3b8; font-weight:700; font-size:0.9rem; cursor:pointer; transition:.2s; }
    .type-btn:hover { border-color:#00c2ff; color:#00c2ff; }
    .type-btn.active[data-type="Allotment"] { background:rgba(0,194,255,.12); border-color:#00c2ff; color:#00c2ff; }
    .type-btn.active[data-type="Submission"] { background:rgba(244,63,94,.12); border-color:#f43f5e; color:#fb7185; }
    .file-opts { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px; border:1px solid #1e293b; border-radius:8px; background:#060a12; }
    .file-opts button { padding:7px 12px; border-radius:6px; border:1px solid #334155; background:#0e1726; color:#e2e8f0; font-size:0.78rem; font-weight:700; cursor:pointer; }
    .file-opts button:hover { border-color:#00c2ff; color:#00c2ff; }
    .file-opts .fname { font-size:0.75rem; color:#94a3b8; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .form-group input[type=file].has-opts { display:none; }
    .form-group input[readonly] { background-color:#0b1a2b; border-color:rgba(0,194,255,.35); color:#34d399; font-weight:700; cursor:not-allowed; }

    /* ===== MOBILE VIEW ===== */
    @media (max-width: 768px) {
      .sidebar { position: fixed !important; bottom: 0; left: 0; right: 0; top: auto !important; width: 100% !important; height: auto !important; z-index: 60; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)) !important; border-right: none; border-top: 1px solid #1e293b; background: rgba(6,10,18,.97); backdrop-filter: blur(8px); }
      .sidebar > div { display: block; }
      .sidebar > div > div:first-child { display: none; }
      .sidebar ul { display: flex; gap: 6px; margin: 0; }
      .sidebar ul > li { flex: 1; }
      .nav-btn { padding: 8px 4px; justify-content: center; }
      .nav-btn span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; line-height: 1.1; text-align: center; }
      .nav-btn span i { margin: 0 !important; font-size: 18px; }
      header { padding-left: 14px !important; padding-right: 10px !important; }
      header h1 { font-size: 0.9rem; }
      .api-txt { display: none; }
      header span.rounded-full { padding: 6px 8px; }
      .flex-1.flex.flex-col.min-w-0 > .p-6 { padding: 12px 12px 96px 12px !important; }
      .whizz-card { padding: 14px; }
      .form-grid-3 { grid-template-columns: 1fr !important; gap: 14px; }
      .form-group input, .form-group select { font-size: 16px; padding: 12px 14px; }
      .grid.grid-cols-3 { grid-template-columns: 1fr !important; }
      .flt-bar { gap: 10px; }
      .flt-bar .form-group { min-width: calc(50% - 5px); flex: 1 1 calc(50% - 5px); }
      .flt-bar .form-group:nth-child(n+3) { flex-basis: 100%; }
      .ms-wrap { min-width: 100%; }
      .ms-menu { max-width: 100%; }
      .flt-clear { width: 100%; }
      .file-opts button { padding: 10px 14px; font-size: 0.85rem; }
      .submit-btn { padding: 16px; }
    }
  </style>
</head>
<body class="flex min-h-screen" data-tab="allotment">

  <aside class="sidebar p-4 flex flex-col justify-between sticky top-0 h-screen">
    <div>
      <div class="flex items-center gap-3 pb-6 border-b border-slate-800 mb-6">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-cyan-500/30">⚡</div>
        <div><div class="font-black text-lg text-white">Whi<span class="text-cyan-400">zZ</span> EV</div><div class="text-[10px] text-cyan-400 tracking-widest font-semibold uppercase">Master Cloud ERP</div></div>
      </div>
      <ul class="space-y-2">
        <li><button class="nav-btn t-allotment active" id="btn-tab-allotment" onclick="switchViewTab('allotment')"><span><i class="fa-solid fa-key mr-2 text-cyan-400"></i> Allotment Form</span></button></li>
        <li><button class="nav-btn t-submission" id="btn-tab-submission" onclick="switchViewTab('submission')"><span><i class="fa-solid fa-file-import mr-2 text-rose-400"></i> Submission Form</span></button></li>
        <li><button class="nav-btn t-net-count" id="btn-tab-net-count" onclick="switchViewTab('net-count')"><span><i class="fa-solid fa-calculator mr-2 text-emerald-400"></i> Net Count Dashboard</span></button></li>
      </ul>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 sticky top-0 z-50">
      <h1 class="text-base font-bold text-white flex items-center gap-2" id="main-title">Rider Allotment Form</h1>
      <span class="bg-blue-900/40 text-cyan-400 text-xs px-3 py-1 rounded-full border border-cyan-500/30 font-medium flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> <span class="api-txt">Google Sheets API Active</span></span>
    </header>

    <div class="p-6 overflow-y-auto flex-1">
      <!-- 1. ENTRY FORM TAB (Allotment + Submission ek hi jagah) -->
      <div id="view-form" class="whizz-card">
        <form onsubmit="handleFormSubmit(event)" class="space-y-6" autocomplete="off">
          <div class="form-grid-3">
            <div class="form-group"><label>Form filled by</label><input type="text" id="f_form_filled_by" placeholder="User / Admin Name"></div>
            <div class="form-group"><label>Date *</label><input type="date" id="f_date" required></div>
            <div class="form-group"><label>Rider Type *</label><select id="f_rider_type" required></select></div>
            <div class="form-group"><label>Rider User ID</label><input type="text" id="f_user_id" placeholder="e.g. RIDER-1024"></div>
            <div class="form-group"><label>Rider Full Name *</label><input type="text" id="f_rider_name" required placeholder="Full Name"></div>
            <div class="form-group"><label>Rider Mobile Number *</label><input type="tel" id="f_mobile_no" required pattern="[0-9]{10}" placeholder="10 Digit Mobile"></div>
            <div class="form-group"><label>Chassis No</label><input type="text" id="f_chassis_no" placeholder="Chassis Number"></div>
            <div class="form-group"><label>Vehicle Number *</label><input type="text" id="f_vehicle_no" required placeholder="Registration Number"></div>
            <div class="form-group"><label>Location / City *</label><select id="f_location" required></select></div>
            <div class="form-group"><label>C.M Name</label><select id="f_cm_name"></select></div>
            <div class="form-group"><label>TL Name *</label><select id="f_tl_name" required></select></div>
            <div class="form-group"><label>Client Name *</label><select id="f_client" required><option value="Zomato">Zomato</option><option value="Porter-2W">Porter-2W</option><option value="Swiggy">Swiggy</option><option value="Rental">Rental</option><option value="3-Wheeler">3-Wheeler</option></select></div>
            <div class="form-group"><label>Vehicle Model</label><input type="text" id="f_vehicle_model" placeholder="Model Name"></div>

            <!-- Sirf Allotment -->
            <div class="form-group only-Allotment"><label>Bank Account No.</label><input type="text" id="allot_bank_acc" placeholder="Bank Account Number"></div>
            <div class="form-group only-Allotment"><label>IFSC Code</label><input type="text" id="allot_ifsc" placeholder="IFSC Code"></div>
            <div class="form-group only-Allotment"><label>Weekly Rent (₹) *</label><input type="number" id="allot_weekly_rent" required placeholder="e.g. 1470"></div>
            <div class="form-group only-Allotment" id="grp_onboarding"><label>On Boarding Amount (₹)</label><input type="number" id="allot_onboarding_amt" placeholder="e.g. 1500"></div>
            <div class="form-group only-Allotment"><label>Aadhar Card Front</label><input type="file" accept="image/*" id="allot_aadhar_front_img"></div>
            <div class="form-group only-Allotment"><label>Aadhar Card Back</label><input type="file" accept="image/*" id="allot_aadhar_back_img"></div>
            <div class="form-group only-Allotment"><label>Pan Card Image</label><input type="file" accept="image/*" id="allot_pan_img"></div>
            <div class="form-group only-Allotment"><label>Bank Passbook/Cheque Image</label><input type="file" accept="image/*" id="allot_passbook_img"></div>
            <div class="form-group only-Allotment"><label>Vehicle Front Image</label><input type="file" accept="image/*" id="allot_v_front_img"></div>
            <div class="form-group only-Allotment"><label>Vehicle Back Image</label><input type="file" accept="image/*" id="allot_v_back_img"></div>
            <div class="form-group only-Allotment"><label>Allotment Form Image</label><input type="file" accept="image/*" id="allot_form_img"></div>

            <!-- Sirf Submission -->
            <div class="form-group only-Submission"><label>Rent Pendency Amount (₹)</label><input type="number" id="sub_rent_pendency" placeholder="e.g. 1200"></div>
            <div class="form-group only-Submission"><label>Damage Amount (₹)</label><input type="number" id="sub_damage_amt" placeholder="e.g. 500"></div>
            <div class="form-group only-Submission"><label>Damage Part Name</label><input type="text" id="sub_damage_part_name" placeholder="e.g. Mirror / Brake Lever"></div>
            <div class="form-group only-Submission"><label>Vehicle Image</label><input type="file" id="sub_vehicle_img" accept="image/*"></div>

            <!-- Dono me common -->
            <div class="form-group" id="grp_amount"><label id="f_amount_label">Total Amount (₹) *</label><input type="number" id="f_amount" required placeholder="Amount"></div>
            <div class="form-group only-Submission" id="grp_sub_total"><label>Total Amount (₹) <span class="text-[10px] text-slate-500 normal-case">(Rent Pendency + Damage − Collection)</span></label><input type="number" id="sub_total_pendency" readonly placeholder="Auto calculate"></div>
            <div class="form-group"><label>Payment Screenshot (Auto OCR)</label><input type="file" id="f_payment_img" accept="image/*" onchange="processOCR(this, 'f_utr_no', 'f_ocr_status')"><span id="f_ocr_status" class="text-xs text-cyan-400 mt-1 font-semibold"></span></div>
            <div class="form-group"><label>UTR Number / Cash <span id="f_utr_star">*</span></label><input type="text" id="f_utr_no" required placeholder="12 Digit UTR or Cash"></div>
            <div class="form-group"><label>Remark</label><input type="text" id="f_remarks" placeholder="Optional notes"></div>
          </div>
          <button type="submit" id="form-submit-btn" class="submit-btn w-full mt-6 flex items-center justify-center gap-2"><i class="fa-solid fa-paper-plane"></i> <span id="form-submit-text">Submit Allotment Form to Google Sheet</span></button>
        </form>
      </div>

      <!-- 3. NET COUNT TAB -->
      <div id="view-net-count" style="display:none;" class="space-y-6">
        <div class="whizz-card" style="padding:18px 24px;">
          <div class="flt-bar">
            <div class="form-group"><label><i class="fa-solid fa-calendar-days mr-1 text-cyan-400"></i> From Date</label><input type="date" id="flt-from" onchange="onFilterChange()"></div>
            <div class="form-group"><label><i class="fa-solid fa-calendar-days mr-1 text-cyan-400"></i> To Date</label><input type="date" id="flt-to" onchange="onFilterChange()"></div>
            <div class="form-group"><label><i class="fa-solid fa-user-tie mr-1 text-cyan-400"></i> TL Name</label><div class="ms-wrap" id="ms-tl"></div></div>
            <div class="form-group"><label><i class="fa-solid fa-user-shield mr-1 text-cyan-400"></i> C.M Name</label><div class="ms-wrap" id="ms-cm"></div></div>
            <div class="form-group"><label><i class="fa-solid fa-user-tag mr-1 text-cyan-400"></i> Rider Type</label><div class="ms-wrap" id="ms-rt"></div></div>
            <button type="button" class="flt-clear" onclick="clearFilters()"><i class="fa-solid fa-rotate-left mr-1"></i> Clear</button>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div class="whizz-card text-center py-4"><div class="text-xs font-bold text-slate-400 uppercase">Total Allotments</div><div class="text-2xl font-black text-cyan-400 mt-1" id="net-total-allotments">0</div></div>
          <div class="whizz-card text-center py-4"><div class="text-xs font-bold text-slate-400 uppercase">Total Submissions</div><div class="text-2xl font-black text-rose-400 mt-1" id="net-total-submissions">0</div></div>
          <div class="whizz-card text-center py-4"><div class="text-xs font-bold text-slate-400 uppercase">Net Count</div><div class="text-2xl font-black text-emerald-400 mt-1" id="net-active-fleet">0</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ================================================================
    // DROPDOWN LIST - yahan se Location / CM / TL add ya hataye
    // Naya naam add karne ke liye: comma ke baad "Naya Naam" likho
    // Hatane ke liye: us line se naam delete kar do
    // ================================================================
    const DROPDOWN_OPTIONS = {
      f_location: ["Mundka", "Rithala Rohini 7", "Chhatarpur", "Ashok Nagar"],
      f_cm_name:  ["Pankaj Chauhan", "Vikas Singh"],
      f_tl_name:  ["Sonu_179", "Kaptan", "Prashant", "Arun kumar", "Nikhil_168", "Lalchand_180"]
    };
    const DROPDOWN_PLACEHOLDER = {
      f_location: "-- Select Location --",
      f_cm_name:  "-- Select C.M --",
      f_tl_name:  "-- Select TL --"
    };
    Object.keys(DROPDOWN_OPTIONS).forEach(id => {
      const sel = document.getElementById(id);
      if (!sel) return;
      sel.innerHTML = '<option value="">' + DROPDOWN_PLACEHOLDER[id] + '</option>' +
        DROPDOWN_OPTIONS[id].map(n => '<option value="' + n + '">' + n + '</option>').join('');
    });
    // Date field pe kahin bhi click karo to calendar khul jaye
    document.querySelectorAll('input[type="date"]').forEach(inp => {
      inp.addEventListener('click', () => { try { inp.showPicker(); } catch (e) {} });
    });
    // ===== Har file input par 2 option: Choose File / Camera =====
    document.querySelectorAll('#view-form input[type=file]').forEach(inp => {
      inp.classList.add('has-opts');
      const box = document.createElement('div'); box.className = 'file-opts';
      box.innerHTML = '<button type="button" class="b-file"><i class="fa-solid fa-folder-open"></i> Choose File</button>' +
                      '<button type="button" class="b-cam"><i class="fa-solid fa-camera"></i> Camera</button>' +
                      '<span class="fname">No file chosen</span>';
      inp.insertAdjacentElement('afterend', box);
      const nameEl = box.querySelector('.fname');
      const showName = () => { nameEl.textContent = inp.files[0] ? inp.files[0].name : 'No file chosen'; };
      box.querySelector('.b-file').onclick = () => inp.click();
      inp.addEventListener('change', showName);
      box.querySelector('.b-cam').onclick = () => {
        const cam = document.createElement('input');
        cam.type = 'file'; cam.accept = 'image/*'; cam.setAttribute('capture', 'environment');
        cam.onchange = () => {
          if (!cam.files[0]) return;
          const dt = new DataTransfer(); dt.items.add(cam.files[0]); inp.files = dt.files;
          showName();
          inp.dispatchEvent(new Event('change', { bubbles: true })); // OCR bhi chale
        };
        cam.click();
      };
    });
    document.querySelector('#view-form form').addEventListener('reset', () => setTimeout(() => {
      document.querySelectorAll('#view-form input[type=file]').forEach(i => { const n = i.nextElementSibling && i.nextElementSibling.querySelector('.fname'); if (n) n.textContent = 'No file chosen'; });
    }, 0));
    // ===== Auto Total =====
    // Allotment: Total = Weekly Rent + On Boarding
    // Submission: Total = Rent Pendency + Damage Amount - Collection Amount
    function recalcTotals() {
      const n = id => parseFloat(document.getElementById(id).value) || 0;
      if (currentType === 'Allotment') {
        const hasAny = document.getElementById('allot_weekly_rent').value !== '' || document.getElementById('allot_onboarding_amt').value !== '';
        document.getElementById('f_amount').value = hasAny ? (n('allot_weekly_rent') + n('allot_onboarding_amt')) : '';
      } else {
        document.getElementById('sub_total_pendency').value = n('sub_rent_pendency') + n('sub_damage_amt') - n('f_amount');
      }
    }
    ['allot_weekly_rent','allot_onboarding_amt','sub_rent_pendency','sub_damage_amt','f_amount'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => { recalcTotals(); if (typeof saveDraft === 'function') saveDraft(); });
    });
    document.querySelector('#view-form form').addEventListener('reset', () => setTimeout(recalcTotals, 0));
    // ================================================================
    // Aapka naya URL yahan fixed hai
    const GOOGLE_SHEET_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2i_9PCkclYPclEKL0QgfFXP_lxcxPsIVRppw0fMlsSo9dL-qDGzcupZKs28xwkN9iXQ/exec';

    let submittedRecords = [];

    window.addEventListener('DOMContentLoaded', () => { fetchSheetData(); });

    // ===== Draft: refresh par data bana rahe, aur Allotment / Submission ka data alag-alag =====

    function saveDraft() {

      document.querySelectorAll('#view-form form input:not([type=file]), #view-form form select').forEach(el => { if (el.id) vals[el.id] = el.value; });

      writeDraft(d);

      const d = loadDraft();

      d.drafts = d.drafts || {}; delete d.drafts[currentType];
      writeDraft(d);

    // ================= OCR: UTR / Ref ID (fast + accurate) =================
    // Worker ek baar bante hi reuse hota hai (har baar load nahi hota) -> fast
    let ocrWorkerPromise = null;
    function getOcrWorker() {
      if (!ocrWorkerPromise) {
        ocrWorkerPromise = Tesseract.createWorker('eng').catch(e => { ocrWorkerPromise = null; throw e; });
      }
      return ocrWorkerPromise;
    }
    // Page khulte hi OCR engine background me taiyar kar lo
    window.addEventListener('load', () => setTimeout(() => { try { getOcrWorker(); } catch (e) {} }, 600));

    // Screenshot ko saaf karo: size theek, grayscale, contrast, dark mode ho to invert
    function prepareForOCR(file) {
      return new Promise(resolve => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          if (w > 1600) w = 1600; else if (w < 1000) w = Math.min(w * 2, 1400);
          const h = Math.round(img.height * (w / img.width));
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, w, h);
          const d = ctx.getImageData(0, 0, w, h), px = d.data;
          let sum = 0;
          for (let i = 0; i < px.length; i += 4) sum += (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114);
          const invert = (sum / (px.length / 4)) < 110;
          for (let i = 0; i < px.length; i += 4) {
            let g = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
            if (invert) g = 255 - g;
            g = (g - 128) * 1.4 + 128;
            g = g < 0 ? 0 : (g > 255 ? 255 : g);
            px[i] = px[i + 1] = px[i + 2] = g;
          }
          ctx.putImageData(d, 0, 0);
          URL.revokeObjectURL(url);
          resolve(c);
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      });
    }

    // OCR text me se UTR / Ref ID nikalna
    function extractRefs(raw) {
      const text = String(raw || '').replace(/\r/g, '\n');
      const found = [];
      const isPhone = v => /^91[6-9]\d{9}$/.test(v) || /^[6-9]\d{9}$/.test(v);
      const fixRun = t => t.replace(/[^\s]{10,}/g, tok => {
        const digits = (tok.match(/\d/g) || []).length;
        return (/^[0-9OoIl|SB]+$/.test(tok) && digits >= 6) ? tok.replace(/[Oo]/g, '0').replace(/[Il|]/g, '1').replace(/S/g, '5').replace(/B/g, '8') : tok;
      });
      const add = (val, label, score) => {
        val = (val || '').replace(/[^A-Za-z0-9]/g, '');
        if (val.length < 10 || val.length > 35 || isPhone(val)) return;
        if (/^\d+$/.test(val) && val.length === 12) score += 10;
        const ex = found.find(f => f.val === val);
        if (ex) { if (score > ex.score) { ex.score = score; ex.label = label; } return; }
        found.push({ val, label, score });
      };
      const tokenRe = /[A-Za-z]{0,5}\d{10,25}[A-Za-z0-9]{0,8}|[A-Z]{4}[A-Z0-9]{12,22}/;
      const kwRe = /(utr|rrn|ref(?:erence)?(?:\s*(?:no|number|num|id))?|upi\s*(?:ref|transaction)[a-z\s.]{0,12}|txn(?:\s*id)?|transaction\s*(?:id|no|number))/gi;
      let m;
      while ((m = kwRe.exec(text)) !== null) {
        let win = text.slice(m.index + m[0].length, m.index + m[0].length + 80);
        win = fixRun(win.replace(/(?<=\d)[ \t]+(?=\d)/g, ''));
        const t = win.match(tokenRe);
        if (t) {
          const k = m[0].toLowerCase();
          if (k.includes('utr')) add(t[0], 'UTR', 100);
          else if (k.includes('ref') || k.includes('rrn')) add(t[0], 'Ref ID', 90);
          else add(t[0], 'Txn ID', 80);
        }
      }
      // Fallback: kisi bhi jagah ka 12 digit number
      const all = fixRun(text.replace(/(?<=\d)[ \t]+(?=\d)/g, ''));
      const re12 = /(?<![A-Za-z0-9])\d{12}(?![A-Za-z0-9])/g;
      while ((m = re12.exec(all)) !== null) add(m[0], '12-digit', 60);
      return found.sort((a, b) => b.score - a.score);
    }

    // Chip par click -> value field me daal do
    document.addEventListener('click', e => {
      const chip = e.target.closest('.ocr-chip');
      if (!chip) return;
      const t = document.getElementById(chip.dataset.target);
      if (t) { t.value = chip.dataset.val; t.dispatchEvent(new Event('input', { bubbles: true })); }
    });

    async function processOCR(fileInput, targetId, msgId) {
      const file = fileInput.files[0];
      if (!file) return;
      const msgEl = document.getElementById(msgId);
      if (msgEl) msgEl.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Reading UTR / Ref ID...';
      try {
        const [worker, canvas] = await Promise.all([getOcrWorker(), prepareForOCR(file)]);
        const result = await worker.recognize(canvas);
        const list = extractRefs(result.data.text);
        if (list.length) {
          const best = list[0];
          const target = document.getElementById(targetId);
          target.value = best.val;
          target.dispatchEvent(new Event('input', { bubbles: true }));
          let html = `<i class="fa-solid fa-circle-check"></i> ${best.label}: ${best.val}`;
          if (list.length > 1) {
            html += '<div class="mt-1 flex flex-wrap gap-1">' + list.slice(1, 5).map(f =>
              `<button type="button" class="ocr-chip" data-target="${targetId}" data-val="${f.val}" style="padding:2px 8px;border:1px solid #334155;border-radius:6px;font-size:11px;color:#e2e8f0;background:#0e1726;">${f.label}: ${f.val}</button>`).join('') + '</div>';
          }
          if (msgEl) msgEl.innerHTML = html;
        } else {
          if (msgEl) msgEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> UTR nahi mila, manual bhariye.';
        }
      } catch (e) {
        console.error(e);
        if (msgEl) msgEl.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-400"></i> OCR Error - manual bhariye';
      }
    }

    // ================= FAST SUBMIT: image choose karte hi background me upload =================
    const uploadCache = {};
    function queueUpload(id) {
      const f = document.getElementById(id).files[0];
      if (!f) { delete uploadCache[id]; return; }
      uploadCache[id] = { file: f, promise: uploadImageToDrive(f) };
    }
    async function getImgUrl(id) {
      const f = document.getElementById(id).files[0];
      if (!f) return '';
      const c = uploadCache[id];
      let url = (c && c.file === f) ? await c.promise : '';
      if (!url) { url = await uploadImageToDrive(f); uploadCache[id] = { file: f, promise: Promise.resolve(url) }; }
      return url;
    }
    document.querySelectorAll('#view-form input[type=file]').forEach(inp => inp.addEventListener('change', () => queueUpload(inp.id)));
    document.querySelector('#view-form form').addEventListener('reset', () => { Object.keys(uploadCache).forEach(k => delete uploadCache[k]); });

    // Image ko chota karke Base64 me convert karna taaki data drop na ho
    function fileToBase64(file) {
      return new Promise((resolve) => {
        if (!file) { resolve(''); return; }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600; // Size kam
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
            canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6)); // Quality kam
          };
          img.onerror = () => resolve('');
        };
        reader.onerror = () => resolve('');
      });
    }

    // Direct Drive Upload Function
    async function uploadImageToDrive(file) {
      if(!file) return "";
      try {
        const base64Data = await fileToBase64(file);
        const formData = new URLSearchParams();
        formData.append("action", "uploadImage");
        formData.append("imageData", base64Data);
        formData.append("fileName", "Whizz_" + Date.now() + ".jpg");

        const response = await fetch(GOOGLE_SHEET_SCRIPT_URL, {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        return result.fileUrl || "";
      } catch (e) {
        console.error("Image Upload Error", e);
        return "";
      }
    }

    async function fetchSheetData() {
      try {
        const response = await fetch(GOOGLE_SHEET_SCRIPT_URL);
        const data = await response.json();
        submittedRecords = Array.isArray(data) ? data.reverse() : [];
        renderMS('tl'); renderMS('cm'); renderMS('rt');
        renderNetCountData();
      } catch (error) {
        console.error("Fetch Error:", error);
      }
    }

    // ===== FILTERS (Date Range + TL + CM) =====
    const filters = { from: '', to: '', tl: new Set(), cm: new Set(), rt: new Set() };

    // Sheet ke column names alag ho sakte hain, isliye flexible lookup
    function getField(r, exact, fuzzy) {
      for (const k of exact) { if (r[k] !== undefined && String(r[k]).trim() !== '') return String(r[k]).trim(); }
      const key = Object.keys(r).find(k => fuzzy.test(k.trim()) && String(r[k]).trim() !== '');
      return key ? String(r[key]).trim() : '';
    }
    const getTL = r => getField(r, ['TL Name', 'TL', 'Tl Name', 'Team Leader', 'Team Leader Name'], /^tl\b|team\s*leader/i);
    const getCM = r => getField(r, ['C.M Name', 'CM Name', 'CM', 'C.M', 'Cluster Manager', 'Cluster Manager Name'], /^c\.?m\b|cluster/i);

    // Record ki date -> 'YYYY-MM-DD' (local)
    function getRecDate(r) {
      const raw = r['Allot Date'] || r['Submission Date'] || r['Sub Date'] || r['Timestamp'] || r.allotDate || r.subDate || '';
      if (!raw) return '';
      const str = String(raw).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      const m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
      if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      const d = new Date(str);
      if (isNaN(d)) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    const getRT = r => getField(r, ['Rider Type', 'Rider type', 'RiderType'], /rider\s*type/i);

    function esc(v) { return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    function getFilteredRecords() {
      return submittedRecords.filter(r => {
        const d = getRecDate(r);
        if (filters.from && (!d || d < filters.from)) return false;
        if (filters.to && (!d || d > filters.to)) return false;
        if (filters.tl.size && !filters.tl.has(getTL(r).toLowerCase())) return false;
        if (filters.cm.size && !filters.cm.has(getCM(r).toLowerCase())) return false;
        if (filters.rt.size && !filters.rt.has(getRT(r).toLowerCase())) return false;
        return true;
      });
    }

    const MS = {
      tl: { el: 'ms-tl', label: 'All TL', get: getTL, set: filters.tl },
      cm: { el: 'ms-cm', label: 'All C.M', get: getCM, set: filters.cm },
      rt: { el: 'ms-rt', label: 'All Rider Type', get: getRT, set: filters.rt }
    };

    function msOptions(key) {
      const map = new Map();
      submittedRecords.forEach(r => { const v = MS[key].get(r); if (v && !map.has(v.toLowerCase())) map.set(v.toLowerCase(), v); });
      return [...map.entries()].sort((a, b) => a[1].localeCompare(b[1]));
    }

    function renderMS(key) {
      const cfg = MS[key], wrap = document.getElementById(cfg.el);
      const wasOpen = wrap.classList.contains('open');
      const opts = msOptions(key);
      // data me jo options nahi hain unhe selection se hata do
      [...cfg.set].forEach(v => { if (!opts.some(o => o[0] === v)) cfg.set.delete(v); });
      const names = opts.filter(o => cfg.set.has(o[0])).map(o => o[1]);
      const text = names.length === 0 ? cfg.label : (names.length === 1 ? names[0] : names.length + ' selected');
      const items = opts.length
        ? opts.map(o => `<div class="ms-item ${cfg.set.has(o[0]) ? 'selected' : ''}" data-ms="${key}" data-val="${encodeURIComponent(o[0])}"><span class="ms-check">${cfg.set.has(o[0]) ? '✓' : ''}</span><span>${esc(o[1])}</span></div>`).join('')
        : '<div class="ms-empty">No data</div>';
      wrap.innerHTML = `<button type="button" class="ms-btn" data-ms-toggle="${key}"><span class="truncate">${esc(text)}</span><i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i></button>
        <div class="ms-menu"><div class="ms-item ${cfg.set.size === 0 ? 'selected' : ''}" data-ms="${key}" data-val="__all"><span class="ms-check">${cfg.set.size === 0 ? '✓' : ''}</span><span>${cfg.label}</span></div>${items}</div>`;
      wrap.classList.toggle('open', wasOpen);
    }

    document.addEventListener('click', e => {
      const tgl = e.target.closest('[data-ms-toggle]');
      const item = e.target.closest('.ms-item');
      if (tgl) {
        const wrap = tgl.closest('.ms-wrap');
        document.querySelectorAll('.ms-wrap.open').forEach(w => { if (w !== wrap) w.classList.remove('open'); });
        wrap.classList.toggle('open');
        return;
      }
      if (item && item.dataset.ms) {
        const key = item.dataset.ms, val = decodeURIComponent(item.dataset.val), set = MS[key].set;
        if (val === '__all') set.clear();
        else if (set.has(val)) set.delete(val); else set.add(val);
        renderMS(key);
        renderNetCountData();
        return;
      }
      if (!e.target.closest('.ms-wrap')) document.querySelectorAll('.ms-wrap.open').forEach(w => w.classList.remove('open'));
    });

    function onFilterChange() {
      filters.from = document.getElementById('flt-from').value;
      filters.to = document.getElementById('flt-to').value;
      renderNetCountData();
    }

    function clearFilters() {
      filters.from = filters.to = '';
      filters.tl.clear(); filters.cm.clear(); filters.rt.clear();
      document.getElementById('flt-from').value = '';
      document.getElementById('flt-to').value = '';
      renderMS('tl'); renderMS('cm'); renderMS('rt');
      renderNetCountData();
    }

    function renderNetCountData() {
      const rows = getFilteredRecords();
      const allotments = rows.filter(r => r["Rider Type"] === 'New Allotment' || r["Rider Type"] === 'Re-Allot').length;
      const submissions = rows.filter(r => r["Rider Type"] === 'Submission' || r.subDate).length;
      const netActive = allotments - submissions; // Net Count = Total Allotments - Total Submissions
      document.getElementById('net-total-allotments').innerText = allotments;
      document.getElementById('net-total-submissions').innerText = submissions;
      document.getElementById('net-active-fleet').innerText = netActive;
    }

    window.addEventListener('DOMContentLoaded', () => { renderMS('tl'); renderMS('cm'); renderMS('rt'); setFormType('Allotment', true); restoreDraft(); const fm = document.querySelector('#view-form form'); fm.addEventListener('input', saveDraft); fm.addEventListener('change', saveDraft); });
